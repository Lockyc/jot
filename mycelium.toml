name    = "jot"
summary = "Hotkey-toggled macOS scratchpad — plain-text tabs, code-editor line ops, and text actions including stripping Claude's quote gutter"
kind    = "app"
status  = "active"
tags    = ["macos", "notes", "scratchpad", "menu-bar", "productivity"]
stack   = ["swift"]

[github]
topics_extra = ["appkit", "swift", "plain-text", "hotkey"]

# "profile" keeps jot off the lockyc profile README until its first release.
[fleet]
exempt      = ["ci", "installer", "profile"]
exempt_note = "macOS-only personal app: the local `just gate` covers the one platform it ships on, and `just install` is the install path"
